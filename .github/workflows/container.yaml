name: Test and publish container

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release tags must use vMAJOR.MINOR.PATCH (for example v0.1.0).'
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: npm run test:frontend
      - run: python manage.py test
      - run: npm run build

  container-test:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: keycafe-tableau:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test production container
        run: |
          set -euo pipefail
          export TABLEAU_IMAGE=keycafe-tableau:test
          export DJANGO_SECRET_KEY=ci-only-container-smoke-test-secret-key-0123456789abcdef
          export DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1

          # Demo mode check: index, security header, WhiteNoise static asset, and API endpoints.
          export KEYCAFE_DEMO_MODE=true
          docker compose -f compose.yaml -f compose.deploy.yaml up -d --no-build --pull never --wait --wait-timeout 90
          INDEX_HEADERS="$(mktemp)"
          INDEX_HTML="$(mktemp)"
          trap 'rm -f "$INDEX_HEADERS" "$INDEX_HTML" "${COOKIES:-}"' EXIT
          curl --fail --silent --dump-header "$INDEX_HEADERS" http://127.0.0.1:8000/ -o "$INDEX_HTML"
          grep -iq '^x-frame-options: *deny' "$INDEX_HEADERS"
          ASSET_PATH="$(python3 -c 'import re, sys; m = re.search(r"(/assets/[^\"]+)", open(sys.argv[1]).read()); assert m, "missing asset"; print(m.group(1))' "$INDEX_HTML")"
          curl --fail --silent "http://127.0.0.1:8000${ASSET_PATH}" > /dev/null
          curl --fail --silent http://127.0.0.1:8000/api/config/ > /dev/null
          curl --fail --silent http://127.0.0.1:8000/api/keys/ > /dev/null

          # Live mode check: verify SQLite WAL writes on /data under read_only: true and UID 10001.
          export KEYCAFE_DEMO_MODE=false
          export DJANGO_CSRF_COOKIE_SECURE=false
          docker compose -f compose.yaml -f compose.deploy.yaml up -d --force-recreate --no-build --pull never --wait --wait-timeout 90
          COOKIES="$(mktemp)"
          CSRF_TOKEN="$(curl --fail --silent -c "$COOKIES" http://127.0.0.1:8000/api/config/ | python3 -c 'import json, sys; print(json.load(sys.stdin)["csrfToken"])')"
          GROUP_ID="$(curl --fail --silent -b "$COOKIES" -X POST \
            -H 'Content-Type: application/json' \
            -H "X-CSRFToken: $CSRF_TOKEN" \
            -d '{"name":"Smoke","keyIds":["123"]}' \
            http://127.0.0.1:8000/api/groups/ | python3 -c 'import json, sys; print(json.load(sys.stdin)["group"]["id"])')"
          curl --fail --silent http://127.0.0.1:8000/api/groups/ | python3 -c 'import json, sys; ids = [g["id"] for g in json.load(sys.stdin)["groups"]]; assert sys.argv[1] in ids' "$GROUP_ID"
          curl --fail --silent -b "$COOKIES" -X DELETE -H "X-CSRFToken: $CSRF_TOKEN" "http://127.0.0.1:8000/api/groups/${GROUP_ID}/" > /dev/null
      - name: Container logs and cleanup
        if: always()
        env:
          TABLEAU_IMAGE: keycafe-tableau:test
          DJANGO_SECRET_KEY: ci-only-container-smoke-test-secret-key-0123456789abcdef
        run: |
          docker compose -f compose.yaml -f compose.deploy.yaml logs --tail=100
          docker compose -f compose.yaml -f compose.deploy.yaml down --volumes

  publish:
    if: github.event_name == 'release'
    needs: container-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Image metadata
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
